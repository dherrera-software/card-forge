<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" width="1024" height="1536">
  <defs>
    <!-- Gradientes de Oro Metálico Fino -->
    <linearGradient id="gold-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="20%" stop-color="#e9c871" />
      <stop offset="45%" stop-color="#b68925" />
      <stop offset="70%" stop-color="#f3d17e" />
      <stop offset="90%" stop-color="#8a6311" />
      <stop offset="100%" stop-color="#543c06" />
    </linearGradient>

    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fbe8a6" />
      <stop offset="50%" stop-color="#d4aa43" />
      <stop offset="75%" stop-color="#fff1be" />
      <stop offset="100%" stop-color="#9a7019" />
    </linearGradient>

    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c49733" />
      <stop offset="50%" stop-color="#73520e" />
      <stop offset="100%" stop-color="#3d2a04" />
    </linearGradient>

    <radialGradient id="gold-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fae498" />
      <stop offset="70%" stop-color="#b38421" />
      <stop offset="100%" stop-color="#4e3404" />
    </radialGradient>

    <!-- Gradientes Dinámicos del Tema (Verde (Viento)) -->
    <radialGradient id="card-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#38ac30" />
      <stop offset="40%" stop-color="#2a8723" />
      <stop offset="75%" stop-color="#1b5916" />
      <stop offset="100%" stop-color="#0d2e0b" />
    </radialGradient>

    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#184714" />
      <stop offset="35%" stop-color="#11330e" />
      <stop offset="80%" stop-color="#0b2109" />
      <stop offset="100%" stop-color="#061305" />
    </linearGradient>

    <linearGradient id="panel-inset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040d03" stop-opacity="0.85" />
      <stop offset="15%" stop-color="#102e0d" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#102e0d" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#040d03" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filtros -->
    <filter id="shadow-deep" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Símbolo: Estrella Cardinal de 8 Puntas Estilo Brújula Celestial -->
    <g id="star-compass">
      <polygon points="0,-24 4,-6 6,-4 24,0 6,4 4,6 0,24 -4,6 -6,4 -24,0 -6,-4 -4,-6" fill="url(#gold-dark)" />
      <polygon points="0,-44 5,-8 0,0" fill="#fff7dd" />
      <polygon points="0,44 -5,8 0,0" fill="#dfb651" />
      <polygon points="44,0 8,5 0,0" fill="#ffe9a6" />
      <polygon points="-44,0 -8,-5 0,0" fill="#dfb651" />
      <polygon points="0,-44 -5,-8 0,0" fill="#9d741c" />
      <polygon points="0,44 5,8 0,0" fill="#66470a" />
      <polygon points="44,0 8,-5 0,0" fill="#886012" />
      <polygon points="-44,0 -8,5 0,0" fill="#4d3405" />
      <polygon points="-24,-24 -5,-5 0,0" fill="#f5d680" />
      <polygon points="24,-24 5,-5 0,0" fill="#fff3c4" />
      <polygon points="24,24 5,5 0,0" fill="#b0811e" />
      <polygon points="-24,24 -5,5 0,0" fill="#75500b" />
      <circle cx="0" cy="0" r="17" fill="none" stroke="url(#gold-primary)" stroke-width="2" />
      <circle cx="0" cy="0" r="13" fill="none" stroke="url(#gold-dark)" stroke-width="1.2" />
      <circle cx="0" cy="0" r="5" fill="url(#gold-radial)" />
    </g>

    <!-- Símbolo: Filigrana Esquinera -->
    <g id="corner-ornament">
      <path d="M 0,40 Q 0,0 40,0" fill="none" stroke="url(#gold-primary)" stroke-width="4.5" />
      <path d="M 6,42 Q 6,6 42,6" fill="none" stroke="url(#gold-bright)" stroke-width="2" />
      <path d="M 12,46 Q 12,12 46,12" fill="none" stroke="url(#gold-dark)" stroke-width="1.5" />
      <circle cx="48" cy="8" r="3.5" fill="#fff4d4" stroke="#75500b" stroke-width="1" />
      <circle cx="8" cy="48" r="3.5" fill="#fff4d4" stroke="#75500b" stroke-width="1" />
      <circle cx="20" cy="20" r="4.5" fill="url(#gold-radial)" stroke="#523908" stroke-width="1" />
      <path d="M 20,20 Q 35,22 45,35" fill="none" stroke="url(#gold-bright)" stroke-width="1.8" />
      <path d="M 20,20 Q 22,35 35,45" fill="none" stroke="url(#gold-bright)" stroke-width="1.8" />
    </g>

    <!-- Máscara de la Ventana de Arte (con muesca para el medallón de coste) -->
    <mask id="art-window-mask">
      <rect x="0" y="0" width="1024" height="1536" fill="#ffffff" />
      <path d="
        M 197,204
        L 914,204
        Q 926,204 926,216
        L 926,1100
        Q 926,1112 914,1112
        L 110,1112
        Q 98,1112 98,1100
        L 98,274
        C 134,228 172,206 197,204
        Z"
        fill="#000000" />
    </mask>
  </defs>

  <!-- ════ 1. FONDO DE LA CARTA ════ -->
  <rect x="0" y="0" width="1024" height="1536" rx="42" fill="url(#card-bg)" mask="url(#art-window-mask)" />

  <!-- ════ 2. BORDES EXTERIORES Y BISELES DEL MARCO ════ -->
  <rect x="8" y="8" width="1008" height="1520" rx="36" fill="none" stroke="url(#gold-dark)" stroke-width="3" opacity="0.9" />
  <rect x="14" y="14" width="996" height="1508" rx="32" fill="none" stroke="url(#gold-primary)" stroke-width="6" />
  <rect x="22" y="22" width="980" height="1492" rx="26" fill="none" stroke="#050f04" stroke-width="2" />
  <rect x="26" y="26" width="972" height="1484" rx="22" fill="none" stroke="url(#gold-bright)" stroke-width="1.8" opacity="0.85" />
  <rect x="32" y="32" width="960" height="1472" rx="18" fill="none" stroke="url(#gold-dark)" stroke-width="1.2" opacity="0.65" stroke-dasharray="6,4" />

  <!-- ════ 3. ORNAMENTOS Y ESTRELLAS PERIMETRALES ════ -->
  <g transform="translate(36, 36)"><use href="#corner-ornament" /></g>
  <g transform="translate(988, 36) scale(-1, 1)"><use href="#corner-ornament" /></g>
  <g transform="translate(36, 1500) scale(1, -1)"><use href="#corner-ornament" /></g>
  <g transform="translate(988, 1500) scale(-1, -1)"><use href="#corner-ornament" /></g>

  <g transform="translate(512, 22) scale(0.68)"><use href="#star-compass" /></g>
  <g transform="translate(512, 1514) scale(0.68)"><use href="#star-compass" /></g>
  <g transform="translate(22, 730) scale(0.72)"><use href="#star-compass" /></g>
  <g transform="translate(1002, 730) scale(0.72)"><use href="#star-compass" /></g>

  <g transform="translate(48, 48) scale(0.78)"><use href="#star-compass" /></g>
  <g transform="translate(976, 48) scale(0.78)"><use href="#star-compass" /></g>
  <g transform="translate(48, 1488) scale(0.78)"><use href="#star-compass" /></g>
  <g transform="translate(976, 1488) scale(0.78)"><use href="#star-compass" /></g>

  <!-- ════ 4. MEDALLÓN DE COSTE (Superior Izquierdo) ════ -->
  <g filter="url(#shadow-deep)">
    <circle cx="112" cy="116" r="82" fill="none" stroke="url(#gold-dark)" stroke-width="1.2" stroke-dasharray="4,6" opacity="0.65" />
    <circle cx="112" cy="116" r="74" fill="none" stroke="url(#gold-primary)" stroke-width="7" />
    <circle cx="112" cy="116" r="70" fill="none" stroke="#050f04" stroke-width="1.5" />
    <circle cx="112" cy="116" r="66" fill="none" stroke="url(#gold-bright)" stroke-width="2.5" />
    <circle cx="112" cy="42" r="4" fill="#fff4d4" stroke="#684c0c" stroke-width="1" />
    <circle cx="186" cy="116" r="4" fill="#fff4d4" stroke="#684c0c" stroke-width="1" />
    <circle cx="112" cy="190" r="4" fill="#fff4d4" stroke="#684c0c" stroke-width="1" />
    <circle cx="38" cy="116" r="4" fill="#fff4d4" stroke="#684c0c" stroke-width="1" />
    <circle cx="112" cy="116" r="63" fill="url(#panel-bg)" />
    <circle cx="112" cy="116" r="63" fill="url(#panel-inset)" />
    <circle cx="112" cy="116" r="60" fill="none" stroke="url(#gold-primary)" stroke-width="1" opacity="0.5" />
  </g>

  <!-- ════ 5. PLACA DE NOMBRE (con muesca izquierda para el medallón) ════ -->
  <g filter="url(#shadow-deep)">
    <path d="
      M 198,62 L 872,62 Q 894,62 904,78 L 904,136 Q 894,152 872,152
      L 198,152 Q 186,134 186,107 Q 186,80 198,62 Z"
      fill="url(#gold-primary)" />
    <path d="
      M 202,66 L 868,66 Q 888,66 898,80 L 898,134 Q 888,148 868,148
      L 202,148 Q 192,132 192,107 Q 192,82 202,66 Z"
      fill="#050f04" />
    <path d="
      M 205,69 L 865,69 Q 884,69 894,82 L 894,132 Q 884,145 865,145
      L 205,145 Q 195,130 195,107 Q 195,84 205,69 Z"
      fill="url(#panel-bg)" />
    <path d="
      M 205,69 L 865,69 Q 884,69 894,82 L 894,132 Q 884,145 865,145
      L 205,145 Q 195,130 195,107 Q 195,84 205,69 Z"
      fill="url(#panel-inset)" />
    <path d="M 210,74 L 860,74 L 886,107 L 860,140 L 210,140 Z"
      fill="none" stroke="url(#gold-bright)" stroke-width="1.2" opacity="0.65" />
  </g>

  <!-- ════ 6. VENTANA CENTRAL DE ARTE (con muesca del medallón) ════ -->
  <g filter="url(#shadow-deep)">
    <path d="
      M 194,196 L 920,196 Q 934,196 934,210 L 934,1106 Q 934,1120 920,1120
      L 104,1120 Q 90,1120 90,1106 L 90,270 Q 90,250 102,238
      C 134,200 166,196 194,196 Z"
      fill="none" stroke="url(#gold-primary)" stroke-width="6" />
    <path d="
      M 197,203 L 914,203 Q 926,203 926,215 L 926,1100 Q 926,1112 914,1112
      L 110,1112 Q 98,1112 98,1100 L 98,274
      C 134,228 172,206 197,203 Z"
      fill="none" stroke="url(#gold-dark)" stroke-width="2.2" />
    <path d="
      M 200,208 L 910,208 L 921,219 L 921,1096 L 910,1107 L 114,1107 L 103,1096 L 103,278
      C 138,234 175,212 200,208 Z"
      fill="none" stroke="url(#gold-bright)" stroke-width="1.2" opacity="0.8" />
  </g>

  <!-- ════ 7. CUADRO DE EFECTOS INFERIOR ════ -->
  <g filter="url(#shadow-deep)">
    <rect x="56" y="1152" width="912" height="316" rx="20" fill="none" stroke="url(#gold-primary)" stroke-width="5" />
    <rect x="62" y="1158" width="900" height="304" rx="16" fill="#050f04" stroke="none" />
    <rect x="66" y="1162" width="892" height="296" rx="14" fill="url(#panel-bg)" />
    <rect x="66" y="1162" width="892" height="296" rx="14" fill="url(#panel-inset)" />
    <rect x="74" y="1170" width="876" height="280" rx="10" fill="none" stroke="url(#gold-bright)" stroke-width="1.5" opacity="0.85" />
    <rect x="80" y="1176" width="864" height="268" rx="8" fill="none" stroke="url(#gold-dark)" stroke-width="1" opacity="0.65" />

    <!-- Esquineros -->
    <path d="M 74,1194 L 74,1170 L 98,1170" fill="none" stroke="url(#gold-primary)" stroke-width="3" />
    <circle cx="86" cy="1182" r="2.5" fill="#fff4d4" />
    <path d="M 950,1194 L 950,1170 L 926,1170" fill="none" stroke="url(#gold-primary)" stroke-width="3" />
    <circle cx="938" cy="1182" r="2.5" fill="#fff4d4" />
    <path d="M 74,1426 L 74,1450 L 98,1450" fill="none" stroke="url(#gold-primary)" stroke-width="3" />
    <circle cx="86" cy="1438" r="2.5" fill="#fff4d4" />
    <path d="M 950,1426 L 950,1450 L 926,1450" fill="none" stroke="url(#gold-primary)" stroke-width="3" />
    <circle cx="938" cy="1438" r="2.5" fill="#fff4d4" />

    <!-- Florón separador -->
    <g transform="translate(512, 1152) scale(0.55)"><use href="#star-compass" /></g>
  </g>

  <!-- ════ 8. FRANJA DE ATK/DEF (Esquina Inferior Derecha del Efecto) ════ -->
  <g filter="url(#shadow-deep)">
    <rect x="690" y="1404" width="252" height="52" rx="10" fill="url(#gold-primary)" />
    <rect x="694" y="1408" width="244" height="44" rx="8" fill="#050f04" />
    <rect x="698" y="1412" width="236" height="36" rx="6" fill="url(#panel-bg)" />
    <rect x="698" y="1412" width="236" height="36" rx="6" fill="url(#panel-inset)" />

    <!-- Filete de separación ATK | DEF -->
    <line x1="816" y1="1414" x2="816" y2="1446" stroke="url(#gold-primary)" stroke-width="1.5" opacity="0.7" />

    <!-- Filete exterior de la franja -->
    <rect x="700" y="1414" width="232" height="32" rx="5" fill="none" stroke="url(#gold-bright)" stroke-width="0.8" opacity="0.6" />

    <!-- Mini-diamantes decorativos en los extremos -->
    <polygon points="700,1430 704,1426 708,1430 704,1434" fill="url(#gold-radial)" />
    <polygon points="928,1430 924,1426 920,1430 924,1434" fill="url(#gold-radial)" />
  </g>
</svg>